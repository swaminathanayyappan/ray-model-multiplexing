# This file was generated using the `serve build` command on Ray v2.34.0.

proxy_location: EveryNode

http_options:

  host: 0.0.0.0

  port: 8000

grpc_options:

  port: 9000

  grpc_servicer_functions: []

logging_config:

  encoding: TEXT

  log_level: INFO

  logs_dir: null

  enable_access_log: true

applications:

- name: ModelMultiplexerApp

  route_prefix: /mma

  import_path: model_multiplex_app:app

  runtime_env: {"pip": ["transformers==4.45.2", "torch==2.4.1"]}

  deployments:

  - name: MultiplexerApp
    num_replicas: 2
