name: CI-Model-multiplexing-serve-app

on:
  push:
    branches:
      - ENH/1/serve-model-multiplexing-code
      - main

jobs:

  create-and-upload-artifact:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.upload_artifact.outputs.artifact_name }}
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Set Release Tag
        run: echo "RELEASE_TAG=v$(date +'%d.%m.%Y-%H%M%S')_${GITHUB_SHA::7}" >> $GITHUB_ENV
      
      - name: Copy files
        run: |
          mkdir -p $RELEASE_TAG
          cp -r ./*.py $RELEASE_TAG/
          cp -r README.md $RELEASE_TAG/
          tree $RELEASE_TAG

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: ${{ env.RELEASE_TAG }}
          retention-days: 15

  download-artifact-and-publish-release:
    runs-on: ubuntu-latest
    needs: create-and-upload-artifact
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.create-and-upload-artifact.outputs.artifact_name }}
          path: ./

      - name: list files
        run: |
          tree .
      
      - name: Generate tag
        id: generate_tag
        run: |
          echo "TAG_NAME=${{ needs.create-and-upload-artifact.outputs.artifact_name }}" >> $GITHUB_ENV
          echo "$TAG_NAME"

      - name: Publish a release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          release_name: " Release ${{ env.TAG_NAME }}"
          body: "Automated release by GitHub Actions for the tag ${{ env.TAG_NAME }}"
          draft: false
          prerelease: false

      # - name: Fetch Release Asset URL
      #   id: get_asset_url
