name: CI-Model-multiplexing-serve-app
on:
  push:
    branches:
      - ENH/1/serve-model-multiplexing-code
      - main
jobs:
  create-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
      - name: Set file name
        run: echo "FILE_NAME=model-multiplex-app-v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
      - name: Create directory and copy files
        run: |
          mkdir -p "$FILE_NAME"
          ls -lah
          cp -r ./*.py $GITHUB_WORKSPACE/$FILE_NAME
          tree $GITHUB_WORKSPACE/$FILE_NAME
      - name: compress files
        run: |
          zip -r $GITHUB_WORKSPACE/$FILE_NAME.zip $GITHUB_WORKSPACE/$FILE_NAME
          ls -lah $GITHUB_WORKSPACE
  upload-app-artifact:
    runs-on: ubuntu-latest
    needs: create-artifact
    steps:
      - name: List files on workspace
        run: ls -lah $GITHUB_WORKSPACE
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}.zip
          path: $GITHUB_WORKSPACE/$FILE_NAME
