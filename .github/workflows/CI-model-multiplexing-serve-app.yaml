name: CI-Model-multiplexing-serve-app

on:
  push:
    branches:
      - ENH/1/serve-model-multiplexing-code
      - main

jobs:

  Build-Serve-App-Config:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release_tag.outputs.RELEASE_TAG}}
    steps:
      - name: Checkout Latest code
        uses: actions/checkout@v4
      
      - name: Install Python and Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Create Release Tag
        id: release_tag
        run: |
          echo "RELEASE_TAG=v$(date +'%d.%m.%Y-%H%M%S')_${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo $RELEASE_TAG
      
      - name: Build serve app config file
        run: |
          serve build model_multiplex_app.app -o manifests/$RELEASE_TAG-app-build-config.yaml
          tree manifests
      
      - name: Create folder structure for artifacts
        run: |
          mkdir $RELEASE_TAG
          mkdir $RELEASE_TAG/manifests
          cp -r manifests/$RELEASE_TAG-app-build-config.yaml $RELEASE_TAG/manifests/app-build-config.yaml
          cp -r *.py $RELEASE_TAG/
          cp -r README.md $RELEASE_TAG/README.md
          tree $RELEASE_TAG
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: ./${{ env.RELEASE_TAG }}
          retention-days: 15
  Download-artifact-and-push-release:
    runs-on: ubuntu-latest
    needs: Build-Serve-App-Config
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.Build-Serve-App-Config.outputs.artifact_name}}
      
      - name: List files
        run: |
          tree .
      