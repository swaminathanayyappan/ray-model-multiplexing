name: CI-Model-multiplexing-serve-app

on:
  push:
    branches:
      - ENH/1/serve-model-multiplexing-code
      - main

jobs:

  Build-Serve-App-Config:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release_tag.outputs.RELEASE_TAG}}
    steps:
      - name: Checkout Latest code
        uses: actions/checkout@v4
      
      - name: Install Python and Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Create Release Tag
        id: release_tag
        run: |
          echo "RELEASE_TAG=v$(date +'%d.%m.%Y-%H%M%S')_${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$(date +'%d.%m.%Y-%H%M%S')_${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      
      - name: Build serve app config file
        run: |
          serve build model_multiplex_app.app -o manifests/$RELEASE_TAG-app-build-config.yaml
          tree manifests
      
      - name: Create folder structure for artifacts
        run: |
          mkdir -p $RELEASE_TAG
          mkdir -p $RELEASE_TAG/manifests
          cp -r manifests/$RELEASE_TAG-app-build-config.yaml $RELEASE_TAG/manifests/app-build-config.yaml
          cp -r *.py $RELEASE_TAG/
          cp -r README.md $RELEASE_TAG/README.md
          tree $RELEASE_TAG
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: ./${{ env.RELEASE_TAG }}
          retention-days: 15

  Download-artifact-and-push-release:
    runs-on: ubuntu-latest
    needs: Build-Serve-App-Config
    env:
      RELEASE_TAG: ${{ needs.Build-Serve-App-Config.outputs.artifact_name}}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG}}
      
      - name: List files
        run: |
          tree .
      
      - name: Release artifact
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: "${{ env.RELEASE_TAG }}"
          body_path: "./README.md"
          draft: false
          prerelease: false
      
      - name: Get asset URL
        id: get_asset_url
        run: |
          ASSET_URL=$(gh api repos/${{ github.repository }}/releases/$release_id/assets --jq '.[0].browser_download_url')
          echo "asset_url=$ASSET_URL" >> $GITHUB_ENV
          echo "asset_url=$ASSET_URL" >> $GITHUB_OUTPUT
          echo $ASSET_URL
