name: CI-Model-multiplexing-serve-app
on:
  push:
    branches:
      - ENH/1/serve-model-multiplexing-code
      - main
jobs:
  create-and-upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
      - name: Set file name
        run: echo "FILE_NAME=model-multiplex-app-v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}
          path: .
  release-from-artifact:
    runs-on: ubuntu-latest
    needs: create-and-upload-artifact
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.create-and-upload-artifact.outputs.artifact_name }}
      - name: list files
        run: |
          ls -lah
