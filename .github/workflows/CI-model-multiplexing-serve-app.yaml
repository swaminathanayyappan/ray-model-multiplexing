name: CI-Model-multiplexing-serve-app

on:
  push:
    branches:
      - ENH/1/serve-model-multiplexing-code
      - main

jobs:

  Build-Serve-App-Config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest code
        uses: actions/checkout@v4
      
      - name: Install Python and Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install Dependencies
        run: |
          pip install ray==2.34.0 ray[serve]

      - name: Create Release Tag
        id: release_tag
        run: |
          echo "RELEASE_TAG=v$(date +'%d.%m.%Y-%H%M%S')_${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo $RELEASE_TAG
      
      - name: Build serve app config file
        run: |
          serve build --help